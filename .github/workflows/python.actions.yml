name: Security Check - Python

on: [pull_request, push]

jobs:
  bandit:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      # security-events: write

    steps:
      - name: Setup GitHub Actions
        uses: actions/checkout@master

      - name: Install Python
        uses: actions/setup-python@master
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip3 install bandit

      # Scan application code only. Tests use `assert` (B101) and fake passwords (B105)
      # by design, and never ship to Lambda; ruff + pytest cover them in ci.yml.
      - name: Run Bandit
        run: bandit -r ./backend -x '*/tests/*,*/integration/*,./backend/integration_support.py'
