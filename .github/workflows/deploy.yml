name: Deploy

# Every push (any branch): run CI, then deploy backend + frontend to AWS, then smoke test.
# There is ONE cloud environment, so the latest push wins: before the demo, push only to main.
# Can also be started by hand from the Actions tab.
#
# Settings → Secrets and variables → Actions:
#   Secrets (sensitive, write-only):
#     PARTICIPANT_CODE   workshop participant code
#     SEED_PASSWORD      password for the seeded demo users in the cloud database
#     PARTICIPANT_URL    optional; only needed if the lookup by EVENT_ID fails
#   Variables (not sensitive; a secret with the same name also works):
#     EVENT_ID           workshop event id used to look up the credentials URL
#     PARTICIPANT_ID     workshop participant id
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of fighting over Terraform state.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: aws
      url: ${{ steps.urls.outputs.website_url }}
    env:
      PARTICIPANT_ID: ${{ vars.PARTICIPANT_ID || secrets.PARTICIPANT_ID }}
      PARTICIPANT_CODE: ${{ secrets.PARTICIPANT_CODE }}
      PARTICIPANT_URL: ${{ secrets.PARTICIPANT_URL }}
      # Terraform passes it to the Lambdas; the first cold start seeds the empty database with it
      TF_VAR_seed_password: ${{ secrets.SEED_PASSWORD }}
      EVENT_ID: ${{ vars.EVENT_ID || secrets.EVENT_ID }}
      # Workshop region from the organisers' email (where the tfstate bucket lives); override with an AWS_REGION variable
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          # Values pasted into GitHub often carry a trailing newline or space; strip them for later steps
          for name in EVENT_ID PARTICIPANT_ID PARTICIPANT_CODE; do
            value=$(printf '%s' "${!name}" | tr -d '[:space:]')
            [ "$name" = PARTICIPANT_CODE ] && [ -n "$value" ] && echo "::add-mask::$value"
            printf -v "$name" '%s' "$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          if [ -z "$PARTICIPANT_ID" ] || [ -z "$PARTICIPANT_CODE" ]; then
            echo "::error::Set the PARTICIPANT_ID variable and the PARTICIPANT_CODE secret"
            exit 1
          fi
          if [ -z "$EVENT_ID" ]; then
            echo "::error::Set the EVENT_ID repository variable (otherwise the wrong workshop API is used and returns 403)"
            exit 1
          fi
          if [ -z "$TF_VAR_seed_password" ]; then
            echo "::error::Set the SEED_PASSWORD repository secret (password for the seeded demo users)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # Terraform's Lambda module pip-installs requirements with the runtime's Python

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false   # the scripts read `terraform output -raw`; the wrapper adds noise

      - name: Deploy backend (Lambdas, database, API)
        run: ./bin/deploy-backend.sh aws

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Deploy frontend (build, S3, CloudFront)
        run: ./bin/deploy-frontend.sh aws

      - name: Read deployed URLs
        id: urls
        working-directory: infra
        run: |
          website_url=$(terraform output -raw website_url)
          api_base_url=$(terraform output -raw api_base_url 2>/dev/null || true)
          echo "website_url=$website_url" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${api_base_url:-$website_url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          WEBSITE_URL: ${{ steps.urls.outputs.website_url }}
          API_URL: ${{ steps.urls.outputs.api_base_url }}
        run: |
          set -o pipefail   # a failed curl inside `curl | jq` must fail the step
          retry="--retry 5 --retry-delay 15 --retry-all-errors --max-time 60"
          curl -fsS $retry -o /dev/null "$WEBSITE_URL"
          echo "✓ frontend responds"
          # First call can be slow: Lambda cold start + ensure_schema() (and seeding an empty database)
          count=$(curl -fsS $retry "${API_URL%/}/api/incidents" | jq length)
          echo "✓ GET /api/incidents returned $count incidents"
          # Sign in as the seeded admin, then use the token: proves auth, JWT secret and seed data
          login=$(jq -cn --arg p "$TF_VAR_seed_password" '{email: "admin@acme.inc", password: $p}')
          token=$(curl -fsS $retry -H 'Content-Type: application/json' --data "$login" \
            "${API_URL%/}/api/auth/login" | jq -r .token)
          me=$(curl -fsS $retry -H "Authorization: Bearer $token" "${API_URL%/}/api/auth/me" | jq -r .email)
          [ "$me" = "admin@acme.inc" ] || { echo "::error::Signed-in /api/auth/me returned '$me'"; exit 1; }
          echo "✓ admin can sign in and /api/auth/me returns $me"
          {
            echo "### Deployed"
            echo "- Website: $WEBSITE_URL"
            echo "- API: ${API_URL%/}/api/incidents ($count incidents)"
            echo "- Sign-in: admin@acme.inc → /api/auth/me OK"
          } >> "$GITHUB_STEP_SUMMARY"

      # When anything above fails, print recent Lambda logs (stack traces) so the cause is in the job log.
      - name: Lambda logs (on failure)
        if: failure()
        run: |
          # The workshop role may not list functions, only touch its own resources, so build the
          # names: coding-workshop-<service>-<participant id> (see infra/lambda.tf, locals.tf app_id).
          groups=()
          for req in backend/*/requirements.txt; do
            svc=$(basename "$(dirname "$req")")
            case "$svc" in _*|.*) continue ;; esac
            groups+=("/aws/lambda/coding-workshop-$svc-$PARTICIPANT_ID")
          done
          groups+=("/aws/rds/cluster/coding-workshop-rds-$PARTICIPANT_ID/postgresql")   # Aurora's own log
          for group in "${groups[@]}"; do
            echo "::group::$group (last 30 minutes)"
            aws logs tail "$group" --since 30m --format short 2>&1 | tail -n 100 || true
            echo "::endgroup::"
          done
