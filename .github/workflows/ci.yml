name: CI

# Checks on every pull request. On every push, deploy.yml calls this workflow first,
# so a push is only deployed when CI is green (and CI does not run twice per push).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # same as the Lambda runtime

      - name: Copy shared code into services
        run: ./bin/sync-common.sh

      - name: Ruff (config in ruff.toml)
        run: pip install ruff && ruff check backend

      - name: Compile all services
        run: python -m compileall -q -x '_examples' backend

      - name: Pytest (once backend tests exist)
        run: |
          if compgen -G "backend/*/tests" > /dev/null; then
            for tests in backend/*/tests; do
              svc="$(dirname "$tests")"
              pip install -q -r "$svc/requirements.txt" pytest pytest-cov
              (cd "$svc" && pytest -q --cov=. --cov-report=term)
            done
          else
            echo "No backend tests yet - skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

  database:
    name: Schema and seed apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres123
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed matches its generator
        run: python3 bin/generate_seed.py --check

      - name: Apply schema and seed
        run: ./bin/init-db.sh

      - name: Re-apply (must be idempotent)
        run: ./bin/init-db.sh

      - name: Seed produced data
        env:
          PGPASSWORD: postgres123
        run: |
          count=$(psql -h localhost -U postgres -tAc "SELECT count(*) FROM incidents")
          echo "incidents seeded: $count"
          test "$count" -gt 0

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres123
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Copy shared code into services
        run: ./bin/sync-common.sh

      # Each service: unit tests plus its handler against a fresh seeded database (backend/<svc>/integration),
      # with coverage of its own code (not vendored libraries). Fails below the 80% target.
      # The shared common/ package is measured once, in auth, where its tests live (tests/test_common_*.py).
      - name: Unit + integration tests with coverage
        run: |
          for tests in backend/*/integration; do
            svc="$(dirname "$tests")"
            shared=""; [ "$svc" = backend/auth ] && shared="--cov=common"
            echo "::group::$svc"
            pip install -q -r "$svc/requirements.txt" pytest pytest-cov
            (cd "$svc" && pytest -q tests integration \
              --cov=service --cov=routes --cov=repository $shared \
              --cov-report=term --cov-fail-under=80)
            echo "::endgroup::"
          done

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  scripts:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: for f in bin/*.sh; do bash -n "$f" || exit 1; done
