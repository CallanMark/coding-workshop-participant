# Python lint config for backend/ (run: ruff check backend)
target-version = "py313"
line-length = 120
extend-exclude = [
  "backend/_examples",
  "backend/*/common",          # generated by bin/sync-common.sh
  "backend/*/psycopg*",        # pip-installed by bin/start-dev.sh
]

[lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "F", "W", "I", "UP", "B"]

[lint.isort]
# Service modules import each other and the synced `common` package as top-level names.
known-first-party = ["common", "function", "repository", "routes", "service"]
